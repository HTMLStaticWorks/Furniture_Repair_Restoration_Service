<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Login | ReviveWood</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'walnut-brown': '#6B4226',
                        'warm-beige': '#F5E9DA',
                        'forest-green': '#3F5D45',
                        'walnut-dark': '#4A2D19'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen flex flex-col items-center justify-center relative transition-colors duration-300 py-12 pt-24 sm:pt-12">

    <!-- Loading Animation -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Background Elements -->
    <div class="fixed inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1599839619722-39751411ea63?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" alt="Wood background" class="w-full h-full object-cover filter brightness-50 dark:brightness-25">
        <div class="absolute inset-0 bg-walnut-dark/80 dark:bg-gray-900/90 mix-blend-multiply"></div>
    </div>

    <!-- Quick controls (Theme/RTL) -->
    <div class="absolute top-4 right-4 sm:top-6 sm:right-6 z-20 flex gap-2 sm:gap-4">
        <button id="themeToggle" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white backdrop-blur-sm transition-colors flex items-center justify-center">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
        <button id="rtlToggle" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white font-semibold text-xs backdrop-blur-sm transition-colors flex items-center justify-center">
            RTL
        </button>
        <a href="index.html" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white backdrop-blur-sm transition-colors flex items-center justify-center" title="Back to Home">
            <i class="fa-solid fa-xmark"></i>
        </a>
    </div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md px-4">
        <div class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-xl rounded-2xl shadow-2xl overflow-hidden border border-white/20 dark:border-gray-700">
            
            <div class="p-8 md:p-10">
                <!-- Logo -->
                <div class="text-center mb-8">
                    <a href="index.html" class="inline-flex items-center gap-3 mb-2">
                        <div
                            class="flex items-center justify-center w-10 h-10 md:w-12 md:h-12 rounded-lg bg-walnut-dark text-warm-beige font-serif font-bold text-2xl md:text-3xl shadow-sm flex-shrink-0">
                            <span>R</span>
                        </div>
                        <span class="font-serif font-bold tracking-normal text-2xl md:text-3xl text-gray-900 dark:text-white">Revive<span
                                class="text-walnut-brown font-medium ml-0.5">Wood</span></span>
                    </a>
                    <p class="text-gray-500 dark:text-gray-400 text-sm">Welcome back! Please login to your account.</p>
                </div>

                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-bold text-white bg-walnut-brown hover:bg-walnut-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-walnut-brown transition-all">
                        Log In
                    </button>

                    <!-- Social Login Divider & Buttons -->
                    <div class="relative my-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
                        </div>
                        <div class="relative flex justify-center text-xs uppercase tracking-wider">
                            <span class="px-3 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400">Or continue with</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <button type="button" class="flex items-center justify-center py-2.5 px-4 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                            <i class="fa-brands fa-google text-red-500 text-lg"></i>
                        </button>
                        <button type="button" class="flex items-center justify-center py-2.5 px-4 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                            <i class="fa-brands fa-facebook text-blue-600 text-lg"></i>
                        </button>
                        <button type="button" class="flex items-center justify-center py-2.5 px-4 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                            <i class="fa-brands fa-apple text-gray-900 dark:text-white text-lg"></i>
                        </button>
                    </div>
                </form>

                <div class="mt-6 text-center border-t border-gray-200 dark:border-gray-700 pt-5">
                    <p class="text-sm text-gray-600 dark:text-gray-400">
                        Don't have an account? 
                        <a href="signup.html" class="font-semibold text-walnut-brown dark:text-warm-beige hover:underline">
                            Create Account
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</body>
</html>
