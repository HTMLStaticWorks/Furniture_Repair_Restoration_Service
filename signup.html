<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Create Account | ReviveWood</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'walnut-brown': '#6B4226',
                        'warm-beige': '#F5E9DA',
                        'forest-green': '#3F5D45',
                        'walnut-dark': '#4A2D19'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen flex flex-col items-center justify-center relative transition-colors duration-300 py-12 pt-24 sm:pt-12">

    <!-- Loading Animation -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Background Elements -->
    <div class="fixed inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1604578762246-41134e37f9cc?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" alt="Wood background" class="w-full h-full object-cover filter brightness-50 dark:brightness-25">
        <div class="absolute inset-0 bg-walnut-dark/80 dark:bg-gray-900/90 mix-blend-multiply"></div>
    </div>

    <!-- Quick controls (Theme/RTL) -->
    <div class="absolute top-4 right-4 sm:top-6 sm:right-6 z-20 flex gap-2 sm:gap-4">
        <button id="themeToggle" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white backdrop-blur-sm transition-colors flex items-center justify-center">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
        <button id="rtlToggle" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white font-semibold text-xs backdrop-blur-sm transition-colors flex items-center justify-center">
            RTL
        </button>
        <a href="index.html" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white backdrop-blur-sm transition-colors flex items-center justify-center" title="Back to Home">
            <i class="fa-solid fa-xmark"></i>
        </a>
    </div>

    <!-- Signup Card -->
    <div class="relative z-10 w-full max-w-lg px-4 my-auto">
        <div class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-xl rounded-2xl shadow-2xl overflow-hidden border border-white/20 dark:border-gray-700">
            
            <div class="p-8 md:p-10">
                <!-- Logo -->
                <div class="text-center mb-8">
                    <a href="index.html" class="inline-flex items-center gap-2 mb-2">
                        <div class="flex items-center justify-center w-8 h-8 md:w-10 md:h-10 rounded bg-gradient-to-br from-walnut-brown to-walnut-dark text-warm-beige shadow-sm border border-walnut-brown/20 font-serif font-bold text-lg md:text-xl relative overflow-hidden flex-shrink-0"><span class="relative z-10">R</span><div class="absolute inset-0 bg-black/10"></div></div>
                        <span class="font-serif font-bold text-2xl md:text-3xl text-gray-900 dark:text-white">Revive<span class="text-walnut-brown">Wood</span></span>
                    </a>
                    <p class="text-gray-500 dark:text-gray-400 text-sm">Join us to manage your restoration projects easily.</p>
                </div>

                <form action="#" method="POST" class="space-y-5">
                    
                    <div>
                        <label for="fullName" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Full Name</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-regular fa-user text-gray-400"></i>
                            </div>
                            <input type="text" id="fullName" required class="w-full pl-11 pr-4 py-3 bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white focus:ring-2 focus:ring-walnut-brown focus:border-transparent transition-all outline-none" placeholder="John Doe">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-regular fa-envelope text-gray-400"></i>
                                </div>
                                <input type="email" id="email" required class="w-full pl-11 pr-4 py-3 bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white focus:ring-2 focus:ring-walnut-brown focus:border-transparent transition-all outline-none" placeholder="john@example.com">
                            </div>
                        </div>

                        <div>
                            <label for="phone" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Phone Number</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-phone text-gray-400"></i>
                                </div>
                                <input type="tel" id="phone" required class="w-full pl-11 pr-4 py-3 bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white focus:ring-2 focus:ring-walnut-brown focus:border-transparent transition-all outline-none" placeholder="(555) 123-4567">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-lock text-gray-400"></i>
                                </div>
                                <input type="password" id="password" required class="w-full pl-11 pr-11 py-3 bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white focus:ring-2 focus:ring-walnut-brown focus:border-transparent transition-all outline-none" placeholder="••••••••">
                                <div class="absolute inset-y-0 right-0 pr-4 flex items-center">
                                    <button type="button" class="text-gray-400 hover:text-walnut-brown transition-colors">
                                        <i class="fa-regular fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label for="confirmPassword" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Confirm Password</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-lock text-gray-400"></i>
                                </div>
                                <input type="password" id="confirmPassword" required class="w-full pl-11 pr-11 py-3 bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-900 dark:text-white focus:ring-2 focus:ring-walnut-brown focus:border-transparent transition-all outline-none" placeholder="••••••••">
                            </div>
                        </div>
                    </div>

                    <div class="flex items-start mt-2">
                        <div class="flex items-center h-5">
                            <input id="terms" name="terms" type="checkbox" required class="h-4 w-4 text-walnut-brown focus:ring-walnut-brown border-gray-300 rounded accent-walnut-brown">
                        </div>
                        <div class="ml-2 text-sm">
                            <label for="terms" class="text-gray-600 dark:text-gray-400">
                                I agree to the <a href="#" class="font-semibold text-walnut-brown dark:text-warm-beige hover:underline">Terms of Service</a> and <a href="#" class="font-semibold text-walnut-brown dark:text-warm-beige hover:underline">Privacy Policy</a>.
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full flex justify-center mt-6 py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-bold text-white bg-walnut-brown hover:bg-walnut-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-walnut-brown transition-all">
                        Create Account
                    </button>

                    <!-- Social Login Divider & Buttons -->
                    <div class="relative my-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
                        </div>
                        <div class="relative flex justify-center text-xs uppercase tracking-wider">
                            <span class="px-3 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400">Or sign up with</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <button type="button" class="flex items-center justify-center py-2.5 px-4 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                            <i class="fa-brands fa-google text-red-500 text-lg"></i>
                        </button>
                        <button type="button" class="flex items-center justify-center py-2.5 px-4 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                            <i class="fa-brands fa-facebook text-blue-600 text-lg"></i>
                        </button>
                        <button type="button" class="flex items-center justify-center py-2.5 px-4 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                            <i class="fa-brands fa-apple text-gray-900 dark:text-white text-lg"></i>
                        </button>
                    </div>
                </form>

                <div class="mt-6 text-center border-t border-gray-200 dark:border-gray-700 pt-5">
                    <p class="text-sm text-gray-600 dark:text-gray-400">
                        Already have an account? 
                        <a href="login.html" class="font-semibold text-walnut-brown dark:text-warm-beige hover:underline">
                            Log In Here
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</body>
</html>
